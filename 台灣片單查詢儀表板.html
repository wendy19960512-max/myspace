<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台灣片單查詢儀表板</title>
<style>
:root{
  --bg:#0e1013; --panel:#16191d; --panel2:#1d2126; --line:#2a2f36;
  --ink:#eef0f2; --sub:#9aa3ad; --accent:#e6b325; --accent2:#3fa9f5;
  --movie:#e6b325; --tv:#3fa9f5; --ok:#4caf6b;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f6f5f2; --panel:#ffffff; --panel2:#f0eee9; --line:#e3e0d8;
    --ink:#1c1c1c; --sub:#6b6b6b; --accent:#b6821a; --accent2:#1c72b8;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1013; --panel:#16191d; --panel2:#1d2126; --line:#2a2f36;
  --ink:#eef0f2; --sub:#9aa3ad; --accent:#e6b325; --accent2:#3fa9f5;
}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; min-height:100%;}
header{padding:22px 20px 16px; border-bottom:1px solid var(--line); position:sticky; top:0;
  background:var(--bg); z-index:5; padding-top: calc(22px + env(safe-area-inset-top, 0px));}
h1{margin:0 0 4px; font-size:1.3rem; font-weight:700;}
.sub{color:var(--sub); font-size:.82rem; line-height:1.6; max-width:780px;}
.controls{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; align-items:center;}
input[type=text], select{background:var(--panel); border:1px solid var(--line); color:var(--ink);
  padding:9px 12px; border-radius:8px; font-size:.87rem; font-family:inherit;}
input[type=text]{flex:1 1 200px; min-width:150px;}
.chip{border:1px solid var(--line); background:var(--panel); color:var(--sub);
  padding:7px 13px; border-radius:999px; font-size:.8rem; cursor:pointer; user-select:none;}
.chip.active{background:var(--accent); color:#1a1400; border-color:var(--accent); font-weight:600;}
.iebtn{border:1px solid var(--accent2); background:transparent; color:var(--accent2);
  padding:7px 13px; border-radius:999px; font-size:.8rem; cursor:pointer; font-weight:600;}
.iebtn:hover{background:rgba(63,169,245,.12);}
.stats{display:flex; gap:16px; margin-top:12px; font-size:.78rem; color:var(--sub); flex-wrap:wrap;}
.stats b{color:var(--ink);}
main{padding:16px 20px 60px; max-width:1000px; margin:0 auto;}
.add-box{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:18px;}
.add-box summary{cursor:pointer; font-size:.88rem; font-weight:600; color:var(--accent2);}
.add-row{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.add-row input, .add-row select{flex:1 1 140px;}
.add-row button{background:var(--accent2); color:#06141f; border:none; padding:9px 16px;
  border-radius:8px; font-weight:700; cursor:pointer; font-size:.84rem;}
.list{display:flex; flex-direction:column; gap:10px;}
.card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px;}
.card.iswatched{border-color:var(--ok);}
.rowtop{display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
.badge{font-size:.66rem; font-weight:700; padding:3px 8px; border-radius:6px; white-space:nowrap;}
.badge.movie{background:rgba(230,179,37,.15); color:var(--movie);}
.badge.tv{background:rgba(63,169,245,.15); color:var(--tv);}
.rank{color:var(--sub); font-size:.72rem; width:32px; text-align:right; flex:0 0 auto;}
.titles{flex:1 1 220px; min-width:170px;}
.titles .zh{font-weight:700; font-size:.95rem;}
.titles .en{color:var(--sub); font-size:.76rem;}
.people{color:var(--sub); font-size:.73rem; flex:1 1 150px; min-width:130px;}
.actions{display:flex; gap:6px; align-items:center; flex-wrap:wrap; flex:0 0 auto;}
.searchbtn{display:inline-flex; align-items:center; gap:5px; text-decoration:none;
  background:var(--panel2); border:1px solid var(--line); color:var(--ink);
  padding:7px 11px; border-radius:8px; font-size:.76rem; white-space:nowrap;}
.searchbtn:hover{border-color:var(--accent2);}
select.platform{min-width:110px; font-size:.76rem; padding:7px 8px;}
select.platform.set{border-color:var(--ok); color:var(--ok); font-weight:600;}
label.watched{display:flex; align-items:center; gap:5px; font-size:.75rem; color:var(--sub); cursor:pointer;}
label.watched.on{color:var(--ok); font-weight:600;}
.recbtn{background:none; border:1px solid var(--line); color:var(--accent); border-radius:8px;
  padding:7px 11px; font-size:.76rem; cursor:pointer;}
.recbox{display:none; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);}
.recbox.open{display:block;}
.recbox ul{margin:4px 0 0; padding-left:18px; font-size:.8rem; color:var(--sub); line-height:1.8;}
.empty{color:var(--sub); text-align:center; padding:40px 0; font-size:.9rem;}
footer{color:var(--sub); font-size:.7rem; text-align:center; padding:0 20px 30px; line-height:1.7;
  padding-bottom: calc(30px + env(safe-area-inset-bottom, 0px));}
#fileInput{display:none;}
</style>
</head>
<body>
<header>
  <h1>台灣片單查詢儀表板</h1>
  <div class="sub">
    台灣沒有公開即時的串流授權 API，無法自動顯示上架平台，改用一鍵搜尋替代：按「JustWatch TW／Google」直接跳去看目前上架狀態，查完自己選平台即可。
    「已看」與「平台」紀錄會存在你目前瀏覽器（localStorage），按「匯出」可存成檔案備份，換裝置或清除瀏覽資料後用「匯入」讀回來就好。
  </div>
  <div class="controls">
    <input type="text" id="q" placeholder="搜尋片名／導演…">
    <span class="chip active" data-type="all">全部</span>
    <span class="chip" data-type="電影">電影</span>
    <span class="chip" data-type="影集">影集</span>
    <span class="chip" data-watched="1">已看過</span>
    <span class="chip" data-unwatched="1">未看過</span>
    <span class="chip" data-haveplatform="1">已記錄平台</span>
    <button class="iebtn" id="exportBtn">⬇ 匯出備份</button>
    <button class="iebtn" id="importBtn">⬆ 匯入備份</button>
    <input type="file" id="fileInput" accept="application/json">
  </div>
  <div class="stats" id="stats"></div>
</header>
<main>
  <details class="add-box">
    <summary>➕ 新增自己的片單</summary>
    <div class="add-row">
      <input type="text" id="newZh" placeholder="中文片名">
      <input type="text" id="newEn" placeholder="英文片名（可留空）">
      <select id="newType"><option value="電影">電影</option><option value="影集">影集</option></select>
      <button id="addBtn">加入清單</button>
    </div>
  </details>

  <div class="list" id="list"></div>
  <div class="empty" id="emptyMsg" style="display:none;">沒有符合條件的項目。</div>
</main>
<footer>
  平台與已看紀錄僅存在你目前瀏覽器；匯出的備份檔可自行保存或分享。<br>
  「延伸推薦」為依導演其他作品、坎城／奧斯卡得獎、同期同類作品整理的參考清單，非官方資料，僅供發現新片參考。
</footer>

const STORAGE_KEY = "nyt100_tw_dashboard_v2";
const CUSTOM_KEY = "nyt100_tw_dashboard_custom_v2";
const PLATFORMS = ["","Netflix","Disney+","HBO Max","Apple TV+","CATCHPLAY+","myVideo","friDay影音","LINE TV","愛奇藝國際站","Prime Video","院線/藍光","查無上架","待確認"];

function keyOf(item){ return item.type + "::" + item.en; }

let state = {};
let custom = [];
try{ state = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }catch(e){ state = {}; }
try{ custom = JSON.parse(localStorage.getItem(CUSTOM_KEY) || "[]"); }catch(e){ custom = []; }

function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
function saveCustom(){ try{ localStorage.setItem(CUSTOM_KEY, JSON.stringify(custom)); }catch(e){} }

// bake in the watched status from the user's uploaded Excel, but never overwrite
// something the user has already changed in THIS dashboard before.
BASE_ITEMS.forEach(it=>{
  const k = keyOf(it);
  if(!(k in state) && it.watched){ state[k] = { watched: true }; }
});
saveState();

function allItems(){ return BASE_ITEMS.concat(custom); }
function justwatchUrl(item){ return "https://www.justwatch.com/tw/search?q=" + encodeURIComponent(item.en || item.zh); }
function googleUrl(item){ return "https://www.google.com/search?q=" + encodeURIComponent((item.zh||"")+" "+(item.en||"")+" 台灣 哪個平台 線上看"); }

let filter = { type:"all", q:"", watched:false, unwatched:false, haveplatform:false };
let openRec = {};

function escapeHtml(s){ return String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function render(){
  const list = document.getElementById("list");
  const items = allItems().filter(it=>{
    if(filter.type!=="all" && it.type!==filter.type) return false;
    if(filter.q){
      const hay=(it.zh+" "+it.en+" "+(it.people||"")).toLowerCase();
      if(!hay.includes(filter.q.toLowerCase())) return false;
    }
    const st = state[keyOf(it)] || {};
    if(filter.watched && !st.watched) return false;
    if(filter.unwatched && st.watched) return false;
    if(filter.haveplatform && !st.platform) return false;
    return true;
  });

  list.innerHTML = "";
  document.getElementById("emptyMsg").style.display = items.length? "none":"block";

  items.forEach(it=>{
    const k = keyOf(it);
    const st = state[k] || {};
    const card = document.createElement("div");
    card.className = "card" + (st.watched? " iswatched":"");
    const badgeClass = it.type==="電影" ? "movie":"tv";
    const hasRecs = it.recs && it.recs.length;

    card.innerHTML = `
      <div class="rowtop">
        <span class="rank">#${it.rank||""}</span>
        <span class="badge ${badgeClass}">${it.type}</span>
        <div class="titles">
          <div class="zh">${escapeHtml(it.zh)}</div>
          <div class="en">${escapeHtml(it.en)}</div>
        </div>
        <div class="people">${escapeHtml(it.people||"")}</div>
        <div class="actions">
          <a class="searchbtn" target="_blank" rel="noopener" href="${justwatchUrl(it)}">🔎 JustWatch TW</a>
          <a class="searchbtn" target="_blank" rel="noopener" href="${googleUrl(it)}">🔎 Google</a>
          <select class="platform ${st.platform?'set':''}" data-key="${k}"></select>
          <label class="watched ${st.watched?'on':''}"><input type="checkbox" data-key="${k}" ${st.watched?'checked':''}> 已看</label>
          ${hasRecs ? `<button class="recbtn" data-key="${k}">🎞 延伸推薦</button>` : ""}
        </div>
      </div>
      ${hasRecs ? `<div class="recbox ${openRec[k]?'open':''}" data-recbox="${k}">
          <ul>${it.recs.map(r=>`<li>${escapeHtml(r)}</li>`).join("")}</ul>
        </div>` : ""}
    `;
    const sel = card.querySelector("select.platform");
    PLATFORMS.forEach(p=>{
      const opt = document.createElement("option");
      opt.value = p; opt.textContent = p || "尚未記錄";
      if((st.platform||"")===p) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.addEventListener("change", e=>{
      const key = e.target.getAttribute("data-key");
      state[key] = state[key] || {};
      state[key].platform = e.target.value;
      saveState();
      e.target.classList.toggle("set", !!e.target.value);
    });
    card.querySelector("input[type=checkbox]").addEventListener("change", e=>{
      const key = e.target.getAttribute("data-key");
      state[key] = state[key] || {};
      state[key].watched = e.target.checked;
      saveState();
      render();
    });
    const recBtn = card.querySelector(".recbtn");
    if(recBtn){
      recBtn.addEventListener("click", ()=>{
        openRec[k] = !openRec[k];
        card.querySelector(`[data-recbox="${k}"]`).classList.toggle("open", openRec[k]);
      });
    }
    list.appendChild(card);
  });

  const total = allItems().length;
  const watchedCount = Object.values(state).filter(s=>s.watched).length;
  const platformCount = Object.values(state).filter(s=>s.platform).length;
  document.getElementById("stats").innerHTML =
    `共 <b>${total}</b> 部　｜　已看 <b>${watchedCount}</b> 部　｜　未看 <b>${total-watchedCount}</b> 部　｜　已記錄平台 <b>${platformCount}</b> 部`;
}

document.getElementById("q").addEventListener("input", e=>{ filter.q = e.target.value; render(); });
document.querySelectorAll(".chip[data-type]").forEach(chip=>{
  chip.addEventListener("click", ()=>{
    document.querySelectorAll(".chip[data-type]").forEach(c=>c.classList.remove("active"));
    chip.classList.add("active");
    filter.type = chip.getAttribute("data-type");
    render();
  });
});
document.querySelector(".chip[data-watched]").addEventListener("click", function(){
  filter.watched = !filter.watched;
  if(filter.watched){ filter.unwatched = false; document.querySelector(".chip[data-unwatched]").classList.remove("active"); }
  this.classList.toggle("active", filter.watched); render();
});
document.querySelector(".chip[data-unwatched]").addEventListener("click", function(){
  filter.unwatched = !filter.unwatched;
  if(filter.unwatched){ filter.watched = false; document.querySelector(".chip[data-watched]").classList.remove("active"); }
  this.classList.toggle("active", filter.unwatched); render();
});
document.querySelector(".chip[data-haveplatform]").addEventListener("click", function(){
  filter.haveplatform = !filter.haveplatform; this.classList.toggle("active", filter.haveplatform); render();
});
document.getElementById("addBtn").addEventListener("click", ()=>{
  const zh = document.getElementById("newZh").value.trim();
  const en = document.getElementById("newEn").value.trim();
  const type = document.getElementById("newType").value;
  if(!zh && !en) return;
  custom.push({type, rank:"", en: en||zh, zh: zh||en, people:"", recs:[]});
  saveCustom();
  document.getElementById("newZh").value=""; document.getElementById("newEn").value="";
  render();
});

document.getElementById("exportBtn").addEventListener("click", ()=>{
  try{
    const payload = { exportedAt: new Date().toISOString(), state, custom };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "nyt100_觀看紀錄備份.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){ alert("匯出失敗：" + e.message); }
});
document.getElementById("importBtn").addEventListener("click", ()=>{
  document.getElementById("fileInput").click();
});
document.getElementById("fileInput").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const payload = JSON.parse(reader.result);
      if(payload.state){ state = Object.assign({}, state, payload.state); saveState(); }
      if(payload.custom){ custom = payload.custom; saveCustom(); }
      render();
      alert("匯入完成！");
    }catch(err){ alert("匯入失敗，檔案格式不正確：" + err.message); }
  };
  reader.readAsText(file);
  e.target.value = "";
});

render();
</script>
