<style>
:root{--bg:#f4f5f1;--card:#fff;--ink:#2d3142;--mute:#6b7088;--line:#d5d8cf;--acc:#5d6aa3;--hl:#fbf5d6;--th:#e8eaf4;--thc:#3b4378;--on:#f4f5f1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171826;--card:#202233;--ink:#e8e9f5;--mute:#9a9db8;--line:#363950;--acc:#8f98d6;--hl:#4a4320;--th:#2a2d49;--thc:#c9cdf0;--on:#171826}}
:root[data-theme="dark"]{--bg:#171826;--card:#202233;--ink:#e8e9f5;--mute:#9a9db8;--line:#363950;--acc:#8f98d6;--hl:#4a4320;--th:#2a2d49;--thc:#c9cdf0;--on:#171826}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:11pt/1.5 "Noto Sans TC","Microsoft JhengHei",sans-serif}
.px{font-family:"DotGothic16","Noto Sans TC",monospace}
.wrap{max-width:1280px;margin:0 auto;padding:32px 24px 60px;display:flex;gap:40px;align-items:flex-start}
aside{width:296px;flex:none;background:#ebece6;color:#2d3142;border:1.5px solid #2d3142;padding:22px 22px 18px;display:flex;flex-direction:column;position:sticky;top:20px}
aside .rule{height:1.5px;background:#2d3142;margin:16px 0}
.chip{border:1.5px solid #2d3142;border-radius:12px;padding:0 10px;font-size:13px}
.badge{border:1.5px solid #2d3142;border-radius:50%;width:132px;height:62px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;line-height:1.2}
.name{font:900 46px/1.1 "Noto Serif TC","Songti TC",serif;letter-spacing:.04em}
aside img{display:block;margin:18px auto 8px;image-rendering:pixelated}
main{flex:1;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--ink);padding-bottom:16px;gap:16px}
.en{font-size:14px;letter-spacing:.14em;color:var(--mute)}
h1{margin:4px 0 0;font:900 35pt/1.15 "Noto Serif TC","Songti TC",serif;letter-spacing:.1em}
.vert{writing-mode:vertical-rl;font:15px "Noto Serif TC",serif;letter-spacing:.3em;color:var(--mute);height:110px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:18px 0 0;padding-bottom:4px}
.tab{height:44px;padding:0 18px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:inherit;border-radius:22px;cursor:pointer;white-space:nowrap}
.tab i{font:normal 13px "DotGothic16",monospace;letter-spacing:.06em;margin-right:8px}
.tab:hover{background:var(--hl)}.tab.on{background:var(--ink);color:var(--on)}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 14px;align-items:center}
.bar input[type=search]{flex:1;min-width:160px}
button.b,.bar input,td textarea{font:inherit;color:var(--ink)}
button.b{height:44px;border:1.5px solid var(--ink);background:transparent;padding:0 18px;border-radius:8px;cursor:pointer}
button.b:hover{background:var(--hl)}
button.p{background:var(--acc);color:#fff;border-color:var(--ink);font-weight:500}button.p:hover{background:var(--acc);filter:brightness(1.08)}
.bar input{height:44px;border:1.5px solid var(--ink);background:var(--card);padding:0 14px;border-radius:8px}
.bar input:focus{outline:0;background:var(--hl)}
.card{background:var(--card);border:1.5px solid var(--ink);overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{background:var(--th);color:var(--thc);font-weight:500;text-align:left;padding:11px 10px;position:sticky;top:0;border-bottom:1.5px solid var(--ink)}
td{border-top:1px solid var(--line);padding:2px;vertical-align:top}
tr[data-i]:hover td{background:rgba(143,152,214,.08)}
td textarea{width:100%;border:1.5px solid transparent;background:transparent;resize:none;padding:7px 9px;border-radius:6px;overflow:hidden;display:block}
td textarea:hover{border-color:var(--line)}td textarea:focus{outline:0;border-color:var(--acc);background:var(--hl)}
td.n{font:13px "DotGothic16",monospace;color:var(--mute);width:48px;text-align:center;padding-top:10px}
td.x{width:48px;text-align:center}
.del{width:40px;height:40px;border:0;background:transparent;color:var(--mute);font-size:20px;cursor:pointer;border-radius:50%}.del:hover{color:#fff;background:#9a4a4a}
.log td{padding:8px 10px}.log td:first-child{white-space:nowrap;color:var(--mute);width:160px;font-family:"DotGothic16","Noto Sans TC",monospace}
.empty{padding:30px;text-align:center;color:var(--mute)}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on);padding:9px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none}
#msg.on{opacity:1}
.hint{color:var(--mute);font-size:10pt;margin-top:14px}
@media (max-width:900px){.wrap{flex-direction:column;padding:16px}aside{width:100%;position:static}.vert{display:none}h1{font-size:28pt}}

  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cur=b.dataset.t;q="";render()});
  const isLog=cur===LOG;
  $("bar").innerHTML=(isLog?"":`<input type="search" id="q" placeholder="搜尋本分頁…" value="${q.replace(/"/g,"&quot;")}"><button class="b p" id="add">＋ 新增一筆</button><button class="b" id="sort">依年度由新到舊排序</button>`)
   +`<button class="b" id="exp">匯出 Excel</button><button class="b" id="imp">匯入 Excel</button><button class="b" id="rst">還原初始資料</button>`+(isLog?`<button class="b" id="clr">清空紀錄</button>`:"");
  if(isLog){
    $("card").innerHTML=S.log.length?`<table class="log"><tr><th>時間</th><th>分頁</th><th>動作</th><th>內容</th></tr>${S.log.map(r=>`<tr>${r.map(c=>`<td>${String(c).replace(/&/g,"&amp;").replace(/</g,"&lt;")}</td>`).join("")}</tr>`).join("")}</table>`:`<div class="empty">尚無紀錄</div>`;
    $("clr").onclick=()=>{if(confirm("確定清空修訂紀錄？")){S.log=[];save();render()}};
  }else{
    const sh=S.sheets[cur];
    $("card").innerHTML=`<table><tr><th>NO.</th>${sh.h.map(h=>`<th>${h}</th>`).join("")}<th></th></tr>${sh.rows.map((r,i)=>`<tr data-i="${i}"><td class="n">${i+1}</td>${sh.h.map((_,j)=>`<td><textarea rows="1" data-j="${j}">${String(r[j]??"").replace(/&/g,"&amp;").replace(/</g,"&lt;")}</textarea></td>`).join("")}<td class="x"><button class="del" title="刪除">×</button></td></tr>`).join("")}</table>`;
    const tas=[...$("card").querySelectorAll("textarea")];
    const colW=j=>sh.h.length>2&&j<sh.h.length?0:0;
    tas.forEach(t=>{grow(t);t.oninput=()=>grow(t);
      t.onchange=()=>{const i=+t.closest("tr").dataset.i,j=+t.dataset.j,old=sh.rows[i][j];const v=t.value.trim();if(v===old)return;sh.rows[i][j]=v;log(cur,"修改",`第${i+1}列「${sh.h[j]}」：${clip(old)} → ${clip(v)}`)}});
    $("card").querySelectorAll(".del").forEach(b=>b.onclick=()=>{const i=+b.closest("tr").dataset.i;if(!confirm("刪除第"+(i+1)+"筆？"))return;const r=sh.rows.splice(i,1)[0];log(cur,"刪除",clip(r.join("｜"),70));render()});
    $("add").onclick=()=>{sh.rows.unshift(sh.h.map(()=>""));log(cur,"新增","新增一筆空白資料");render();const f=$("card").querySelector("textarea");f&&f.focus()};
    $("sort").onclick=()=>{sh.rows.sort((a,b)=>String(b[0]).localeCompare(String(a[0])));log(cur,"排序","依年度由新到舊");render();toast("已排序")};
    const filt=()=>{const k=q.trim().toLowerCase();$("card").querySelectorAll("tr[data-i]").forEach(tr=>{tr.style.display=!k||sh.rows[+tr.dataset.i].join(" ").toLowerCase().includes(k)?"":"none"})};
    $("q").oninput=e=>{q=e.target.value;filt()};filt();
  }
  $("exp").onclick=exportXlsx;$("imp").onclick=()=>$("file").click();
  $("rst").onclick=()=>{if(confirm("將所有分頁還原成最初資料？目前的編輯會被覆蓋。")){S=JSON.parse(JSON.stringify(SEED));save();cur=Object.keys(S.sheets)[0];render();toast("已還原")}};
}

async function exportXlsx(){
  try{
    const wb=XLSX.utils.book_new();
    for(const[k,v]of Object.entries(S.sheets)){
      const ws=XLSX.utils.aoa_to_sheet([[`鄭琬融｜${k}`],v.h,...v.rows]);
      ws["!merges"]=[{s:{r:0,c:0},e:{r:0,c:v.h.length-1}}];
      ws["!cols"]=v.h.map((_,j)=>({wch:v.h.length===2?(j?90:20):26}));
      XLSX.utils.book_append_sheet(wb,ws,k);
    }
    const lg=XLSX.utils.aoa_to_sheet([[`鄭琬融｜${LOG}`],["時間","分頁","動作","內容"],...S.log]);
    lg["!cols"]=[{wch:18},{wch:14},{wch:8},{wch:80}];XLSX.utils.book_append_sheet(wb,lg,LOG);
    const data=XLSX.write(wb,{bookType:"xlsx",type:"array"});
    const d=await claude.use("downloads");
    if(!d){toast("此環境無法下載檔案");return}
    await d.save({filename:"鄭琬融_個人資料整理.xlsx",data});toast("已匯出");
  }catch(e){if(e&&e.code==="declined")return;toast("匯出失敗："+(e.message||e))}
}

$("file").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});let n=0;
    for(const name of wb.SheetNames){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:false,defval:""});
      if(name===LOG){const i=rows.findIndex(r=>r[0]==="時間");if(i>=0){S.log=rows.slice(i+1).filter(r=>r.some(c=>c!=="")).map(r=>r.slice(0,4).map(String))}continue}
      const sh=S.sheets[name];if(!sh)continue;
      const hi=rows.findIndex(r=>String(r[0]).trim()===sh.h[0]);if(hi<0)continue;
      const data=rows.slice(hi+1).filter(r=>r.some(c=>String(c).trim()!=="")).map(r=>sh.h.map((_,j)=>String(r[j]??"").trim()));
      sh.rows=data;n++;log(name,"匯入",`由「${clip(f.name,30)}」匯入 ${data.length} 筆`);
    }
    save();render();toast(n?`已匯入 ${n} 個分頁`:"找不到可匯入的分頁（分頁名稱與欄位需與匯出檔一致）");
  }catch(err){toast("匯入失敗："+err.message)}
};
render();
</script></body></html>
